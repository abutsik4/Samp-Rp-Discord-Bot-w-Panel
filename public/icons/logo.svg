<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JepsenCloud Bot + Panel logo">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(182 150) rotate(55) scale(440)">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#05070D"/>
    </radialGradient>

    <linearGradient id="glass" x1="132" y1="150" x2="380" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>

    <linearGradient id="accent" x1="150" y1="150" x2="370" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="soft" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Base circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Accent ring -->
  <circle cx="256" cy="256" r="210" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="10" filter="url(#soft)"/>

  <!-- Panel window (glass) -->
  <g filter="url(#shadow)">
    <rect x="126" y="168" width="320" height="230" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.14"/>

    <!-- Top bar -->
    <rect x="126" y="168" width="320" height="56" rx="28" fill="#000000" fill-opacity="0.18"/>
    <circle cx="160" cy="196" r="7" fill="#FF5F57" fill-opacity="0.9"/>
    <circle cx="184" cy="196" r="7" fill="#FFBD2E" fill-opacity="0.9"/>
    <circle cx="208" cy="196" r="7" fill="#28C840" fill-opacity="0.9"/>

    <!-- Content blocks -->
    <rect x="154" y="248" width="168" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.14"/>
    <rect x="154" y="278" width="210" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="154" y="308" width="130" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.12"/>

    <!-- Mini chart -->
    <path d="M350 332 C360 315, 372 318, 386 292 C398 270, 412 270, 420 258" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <path d="M350 332 C360 315, 372 318, 386 292 C398 270, 412 270, 420 258" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bot badge overlay -->
  <g>
    <circle cx="376" cy="152" r="54" fill="#000000" fill-opacity="0.20" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="376" cy="152" r="47" fill="#0B1220" fill-opacity="0.70"/>

    <!-- Antenna -->
    <path d="M376 96 L376 78" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="6" stroke-linecap="round"/>
    <circle cx="376" cy="66" r="8" fill="url(#accent)"/>

    <!-- Face -->
    <rect x="344" y="124" width="64" height="52" rx="18" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="364" cy="150" r="7" fill="#FFFFFF" fill-opacity="0.8"/>
    <circle cx="388" cy="150" r="7" fill="#FFFFFF" fill-opacity="0.8"/>
    <path d="M362 168 C368 174, 384 174, 390 168" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Subtle highlight -->
  <path d="M94 252 C112 130, 206 64, 316 76" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="18" stroke-linecap="round"/>
</svg>
