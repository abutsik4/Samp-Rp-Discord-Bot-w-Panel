<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JepsenCloud Panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#246a73"/>
      <stop offset="0.55" stop-color="#368f8b"/>
      <stop offset="1" stop-color="#f3dfc1"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="30" fill="none" opacity="0.20" stroke="#ffffff" stroke-width="2"/>

  <!-- centered cloud (symmetric) -->
  <g fill="#ffffff" fill-opacity="0.95">
    <circle cx="26" cy="34" r="9"/>
    <circle cx="32" cy="30" r="11"/>
    <circle cx="40" cy="34" r="8"/>
    <rect x="18" y="34" width="28" height="14" rx="7"/>
  </g>

  <!-- panel bars (centered) -->
  <g fill="#0b1220" fill-opacity="0.70">
    <rect x="26" y="35" width="4" height="12" rx="2"/>
    <rect x="30" y="32" width="4" height="15" rx="2"/>
    <rect x="34" y="37" width="4" height="10" rx="2"/>
  </g>
</svg>
